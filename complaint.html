<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register Complaint</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ===== Government Header ===== -->
<header class="gov-header">
  <img src="images/emblem.png" class="logo">
  <div>
    <h1>Smart Urban Grievance & Service Response System</h1>
    <p>Government of India | Smart City Mission</p>
  </div>
</header>

<!-- ===== Navbar Section ===== -->
<div class="navbar">
<div class="nav-right">
    Smart Urban Grievance System
  </div>
  <div class="nav-left">
    <a href="index.html">Home</a>
    <a href="complaint.html">Register Complaint</a>
    <a href="status.html">Track Status</a>
    <a href="admin.html">Admin Login</a>
  </div>

  

</div>

  
</div>

<div class="form-container">
<form id="complaintForm" class="premium-form">

<h3>Register Complaint</h3>

<input type="text" id="name" placeholder="Citizen Name" required>

<select id="issue" required>
<option value="">Select Issue Type</option>
<option>Pothole</option>
<option>Garbage</option>
<option>Street Light</option>
<option>Water Leakage</option>
</select>

<textarea id="desc" placeholder="Describe Issue" required></textarea>

<input type="text" id="location" placeholder="Location Address" required>

<button type="button" onclick="getLocation()">📍 Get Live Location</button>
<br>
<!---<label>Live Camera Photo</label>--->
<button type="button" onclick="startCamera()">Start Camera</button>

<video id="video" width="100%" height="250" autoplay style="cursor:pointer"></video>
<canvas id="canvas" style="display:none;"></canvas>

<img id="capturedImage" style="display:none; width:100%; margin-top:10px;">

<label> Or Upload Image of Site</label>
<input type="file" id="imageUpload" accept="image/*">
<img id="preview" style="display:none; width:100%; margin-top:10px;">

<button type="submit">Submit Complaint</button>

</form>
</div>
<!-- ===== Footer ===== -->
<footer class="main-footer">
  <div class="footer-content">
    <p>© 2026 Smart City Mission</p>
    <p>Government of India Initiative</p>
    <p>All Rights Reserved</p>
  </div>
</footer>

<script src="script.js"></script>


</body>
</html>
