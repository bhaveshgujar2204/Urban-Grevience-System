<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ===== Government Header ===== -->
<header class="gov-header">
  <img src="emblem.png" class="logo">
  <div>
    <h1>Smart Urban Grievance & Service Response System</h1>
    <p>Government of India | Smart City Mission</p>
  </div>
</header>

<!-- ===== Navbar Section ===== -->
<div class="navbar">
<div class="nav-right">
    Smart Urban Grievance System
  </div>
  <div class="nav-left">
    <a href="index.html">Home</a>
    <a href="complaint.html">Register Complaint</a>
    <a href="status.html">Track Status</a>
    <a href="admin.html">Admin Login</a>
  </div>

  

</div>

<div class="main-content admin-center">
<div class="form-container ">
<form class="premium-form" id="adminLogin">

<h3>Admin Login</h3>

<input type="text" id="username" placeholder="Enter Username" required>
<input type="password" id="password" placeholder="Enter Password" required>

<button class="submit-btn">Login</button>

</form>
</div>
</div>
<script>
document.getElementById("adminLogin").addEventListener("submit",function(e){
e.preventDefault();

let user = document.getElementById("username").value;
let pass = document.getElementById("password").value;

if(user === "admin" && pass === "admin123"){
    window.location.href="dashboard.html";
}
else{
    alert("Invalid Credentials");
}

});
</script>

</body>
</html>
